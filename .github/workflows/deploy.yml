name: Eliz Scalp Engine Scan & Deploy

on:
  schedule:
    # Pemindaian otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-scalp-deploy"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Unit & Gate Safety Tests
        run: npm test

      # Jika bursa/API gagal sesaat, dashboard TETAP ter-deploy dengan data terakhir
      - name: Run Live Multi-Exchange Scalping Scan
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: npm run scan

      - name: Commit Updated Signals & Forward Journal
        run: |
          git config user.name "eliz-scalp-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(scalp): update live triggers & journal [skip ci]"
            git pull --rebase origin main || true
            git push || echo "Push dilewati (tidak fatal)."
          else
            echo "No changes in data/ to commit."
          fi

      - name: Prepare static site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
